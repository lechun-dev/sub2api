name: Deploy to Openclaw

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Version or immutable image tag, for example v0.2.18 or sha-<40-character-commit-sha>'
        required: true
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: deploy-sub2api-openclaw
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy on openclaw
    runs-on:
      - self-hosted
      - openclaw
      - sub2api
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy published image
        shell: bash
        env:
          REQUESTED_IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          IMAGE_TAG="$REQUESTED_IMAGE_TAG"

          # 2026-09-17 coder(lq): Published version images omit the release tag's leading "v".
          if [[ "$IMAGE_TAG" == v* ]]; then
            IMAGE_TAG="${IMAGE_TAG#v}"
          fi

          if [[ ! "$IMAGE_TAG" =~ ^sha-[0-9a-f]{40}$ && ! "$IMAGE_TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Expected a version tag such as v0.2.18 or an immutable sha-<40-character-commit-sha> tag, got: $REQUESTED_IMAGE_TAG" >&2
            exit 1
          fi

          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}:${IMAGE_TAG}"
          echo "Deploying ${IMAGE}"
          /opt/sub2api/deploy/deploy-from-image.sh "$IMAGE" "$GITHUB_WORKSPACE"
