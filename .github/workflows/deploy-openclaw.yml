name: Deploy to Openclaw

on:
  workflow_run:
    workflows:
      - Publish Container Image
    types:
      - completed
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Immutable image tag to deploy, for example sha-<40-character-commit-sha>'
        required: true
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: deploy-sub2api-openclaw
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy on openclaw
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on:
      - self-hosted
      - openclaw
      - sub2api
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy published image
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            IMAGE_TAG="sha-${{ github.event.workflow_run.head_sha }}"
          else
            IMAGE_TAG="${{ inputs.image_tag }}"
          fi

          if [[ ! "$IMAGE_TAG" =~ ^sha-[0-9a-f]{40}$ ]]; then
            echo "Expected an immutable sha-<40-character-commit-sha> image tag, got: $IMAGE_TAG" >&2
            exit 1
          fi

          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}:${IMAGE_TAG}"
          echo "Deploying ${IMAGE}"
          /opt/sub2api/deploy/deploy-from-image.sh "$IMAGE" "$GITHUB_WORKSPACE"
